[project]
name = "marisai-backend"
version = "0.1.0"
description = "OceanMind AI Backend - Marine Data Ingestion & API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "geoalchemy2>=0.20.0",
    # `pymongo` and `authlib` were dropped when authentication was removed —
    # they backed the user store and the Google OAuth flow respectively, and
    # nothing else imported them. See docs/AUTH_REMOVAL.md to restore.
    # HTTP clients
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    # Live AIS websocket feed (services/ais.py). Already present via
    # uvicorn[standard], but declared directly since we import it ourselves.
    "websockets>=13.0",
    # services/tides.py builds a custom SSL context to work around
    # tsunami.incois.gov.in serving an incomplete certificate chain. Already
    # present via httpx, but declared directly since we import it ourselves.
    "certifi>=2024.0.0",
    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # Retry logic
    "tenacity>=8.2.0",
    # Data processing
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "xarray>=2024.0.0",
    "netcdf4>=1.6.0",
    "h5netcdf>=1.3.0",
    # GIS
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    # Copernicus
    "copernicusmarine>=2.4.0",
    # Raster tile rendering
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    # Forecasting engine (services/../forecasting/). This is the one place the
    # backend carries a modelling dependency: `services/predictions.py`
    # deliberately serves *precomputed* grids from `machine_learning/` so that
    # package stays out of the import graph, and that boundary is unchanged.
    # The forecasting engine is different in kind — it answers an arbitrary
    # point/variable/horizon that no offline export could have enumerated, so
    # it has to run inference in-process. LightGBM's wheel is ~1.5MB and SHAP's
    # TreeExplainer is exact and fast on it, which is why this stays cheap.
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    # Not a direct import: shap pulls numba, and left unconstrained the
    # resolver backtracks to llvmlite 0.36, whose setup.py hard-refuses any
    # Python above 3.9 and fails the whole sync. numba >=0.59 is the first
    # series carrying py3.11 llvmlite wheels.
    "numba>=0.59",
    # scikit-learn is a shap/lightgbm companion here, not a modelling choice:
    # only its metrics and the isotonic/quantile helpers are used.
    "scikit-learn>=1.4.0",
    # Config-driven variable registry for the forecasting engine.
    "pyyaml>=6.0",
    # On-disk history cache format (see forecasting/history.py).
    "pyarrow>=15.0.0",
    # Conversational agent (services/chat/). `langchain-core` alone carries the
    # tool/message abstractions and the `bind_tools` contract; the heavyweight
    # `langchain` meta-package is deliberately not pulled in, since the agent
    # loop here is explicit (see services/chat/agent.py for why).
    #
    # Provider adapters are imported lazily so an install only needs the one
    # matching LLM_PROVIDER.
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-google-genai>=2.0.0",
    # HTML text extraction for the web_research specialist's fetch_webpage
    # tool (services/webpage.py). Already present transitively via
    # nbconvert/jupyter, but declared directly since it is now imported by
    # production code, not just a notebook-tooling dependency.
    "beautifulsoup4>=4.12.0",
    # PDF report export (download service)
    "matplotlib>=3.8.0",
    "reportlab>=4.0.0",
    # Utilities
    "email-validator>=2.1.0",
    "python-dateutil>=2.8.0",
    "loguru>=0.7.0",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "greenlet>=3.5.4",
    "langchain-ollama>=0.2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The `dependencies*` entry (the FastAPI dependency package, which held only
# `dependencies/auth.py`) went with authentication — no route is guarded any
# more. Restore both the package and this entry together if sign-in returns,
# or every guarded router dies at import with "No module named 'dependencies'".
include = ["app*", "routers*", "alembic*", "services*", "forecasting*"]
exclude = ["others*", "tests*"]

[tool.setuptools.package-data]
# The forecasting engine's variable registry is a YAML file read at import
# time. Without this it is omitted from a built distribution and the whole
# package fails to load with "forecasting config not found".
forecasting = ["config/*.yaml"]
# services/geofencing.py reads India's EEZ polygons from a JSON file at
# import time (real Marine Regions geometry, too large to embed as a Python
# literal) — same failure mode as the forecasting config above without this.
services = ["geo_data/*.json"]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "black>=24.0.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.0",
    "ipykernel>=7.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TID"]
ignore = ["E501", "SIM103", "TID252"]

[tool.ruff.per-file-ignores]
# `configure_logging()` runs between the import blocks, which is E402 by
# construction and is the whole point: router modules log while being imported,
# so configuring after them — or from the lifespan hook — is too late to catch
# it. See app/core/logging.py for what the unconfigured state cost.
"main.py" = ["E402"]
# `X` / `X_train` / `X_test` for a feature matrix is the universal convention
# in ML code (scikit-learn's own signatures use it), and the capital is
# meaningful: uppercase is the matrix, lowercase `y` the target vector.
# Renaming them to satisfy pep8 would make this code read as unlike every
# other model-training file a reader has seen.
"forecasting/*.py" = ["N803", "N806"]
"tests/test_forecasting.py" = ["N803", "N806"]

[tool.ruff.flake8-bugbear]
# `x: T = Depends(...)` in a parameter default is FastAPI's dependency-injection
# idiom, not the mutable-default bug B008 is meant to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.mypy]
python_version = "3.11"
# Without this, mypy reads `x: int = Field(5, ge=2)` as assigning a FieldInfo
# and then reports every `Config()` call as missing required arguments — a
# stream of false positives on models that are entirely correct.
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# `scripts/` is deliberately excluded from the installed package (see
# packages.find above) — it is a CLI, not library code — so unlike `services`
# or `forecasting` it is not importable from the venv. Its tests still need
# it, and a collection failure there interrupts the *whole* suite rather than
# failing one module. Putting the backend root on the path imports it as a
# namespace package, matching how the CLI is actually run (`cd backend &&
# python scripts/train_forecasting.py`).
pythonpath = ["."]
