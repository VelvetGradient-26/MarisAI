# MarisAI forecasting engine — the only file you edit to add a variable.
#
# Adding one is three steps and no Python:
#   1. Make sure the variable exists and is `available: true` in
#      services/download/registry.py (that is what supplies its history).
#   2. Add a block under `variables:` naming that code. An empty block is
#      valid and inherits everything below.
#   3. Run `python scripts/train_forecasting.py --variable <key>`.
#
# The loader validates every `code` and `covariate` against the download
# registry at import time, so a typo or an unimplemented provider fails fast
# with a message naming it.

defaults:
  # Trained horizons. 90 and 365 are listed in supported_horizons instead:
  # the API accepts them, and answers "no model trained for this horizon yet"
  # rather than pretending 30 days of skill extends to a year.
  horizons: [1, 3, 7, 30]
  supported_horizons: [1, 3, 7, 14, 30, 90, 365]
  max_history_days: 3650

  features:
    lags: [1, 3, 7, 14, 30]
    rolling_windows: [7, 14, 30]
    rolling_statistics: [mean, std, min, max]
    differences: true
    trend_windows: [7, 30]
    calendar: true
    cyclical: true
    static: true

  model:
    kind: lightgbm
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
    random_state: 42

  validation:
    n_splits: 5
    # null => use the forecast horizon as the embargo, which is the correct
    # default: a training row within h days of the test window shares its
    # target period.
    embargo_days: null
    min_train_fraction: 0.4

  uncertainty:
    method: residual_bootstrap
    n_bootstrap: 500
    confidence_level: 0.95
    random_seed: 42

  # Benchmarking only, never served. Off by default because prophet is a heavy
  # optional install; `pip install prophet` and flip this to compare.
  baseline:
    enabled: false
    kind: prophet
    yearly_seasonality: true
    weekly_seasonality: false

  # Off by default. Every source here is a quality-controlled model or
  # reanalysis product with no instrument spikes to remove, and measurement
  # showed the Hampel filter flagging 5-12% of a clean Copernicus SST series
  # at every setting tried — its local-scale assumption inverts on a smooth
  # field. Set `method: hampel` per variable if a genuinely noisy observational
  # source is ever wired in behind one.
  outliers:
    method: none
    threshold: 4.0
    window: 15

  training:
    history_days: 730
    resolution: daily
    min_rows_per_point: 120
    min_total_rows: 400

    # Global ocean sample. One model per (variable, horizon) is fitted across
    # all of these at once with lat/lon/bathymetry as features, so it scores
    # an arbitrary coordinate instead of only the points below.
    #
    # Chosen for basin coverage and regime variety — upwelling, gyre,
    # monsoon, western-boundary-current, polar — because a model trained only
    # on calm subtropical gyres has never seen the dynamics it will be asked
    # about. The northern Indian Ocean is deliberately over-sampled: it is the
    # platform's primary region of interest.
    points:
      # --- Northern Indian Ocean (primary region) ---
      - { name: arabian_sea_central,    latitude: 15.0,  longitude: 65.0 }
      - { name: arabian_sea_north,      latitude: 21.0,  longitude: 66.0 }
      - { name: kerala_upwelling,       latitude: 9.5,   longitude: 75.0 }
      - { name: bay_of_bengal_central,  latitude: 15.0,  longitude: 88.0 }
      - { name: bay_of_bengal_north,    latitude: 19.0,  longitude: 89.0 }
      - { name: andaman_sea,            latitude: 11.0,  longitude: 94.0 }
      - { name: lakshadweep,            latitude: 11.0,  longitude: 72.0 }
      - { name: gulf_of_mannar,         latitude: 8.5,   longitude: 78.5 }
      - { name: equatorial_indian,      latitude: 0.0,   longitude: 80.0 }
      - { name: somali_current,         latitude: 6.0,   longitude: 52.0 }
      # --- Pacific ---
      - { name: kuroshio,               latitude: 33.0,  longitude: 140.0 }
      - { name: north_pacific_gyre,     latitude: 30.0,  longitude: -150.0 }
      - { name: equatorial_pacific,     latitude: 0.0,   longitude: -140.0 }
      - { name: peru_upwelling,         latitude: -12.0, longitude: -78.0 }
      - { name: south_pacific_gyre,     latitude: -30.0, longitude: -120.0 }
      - { name: coral_sea,              latitude: -18.0, longitude: 152.0 }
      # --- Atlantic ---
      - { name: gulf_stream,            latitude: 36.0,  longitude: -70.0 }
      - { name: sargasso_sea,           latitude: 28.0,  longitude: -60.0 }
      - { name: canary_upwelling,       latitude: 24.0,  longitude: -18.0 }
      - { name: equatorial_atlantic,    latitude: 0.0,   longitude: -25.0 }
      - { name: benguela_upwelling,     latitude: -25.0, longitude: 12.0 }
      - { name: north_sea,              latitude: 56.0,  longitude: 3.0 }
      # --- Southern / high latitude ---
      - { name: southern_ocean_indian,  latitude: -45.0, longitude: 75.0 }
      - { name: agulhas,                latitude: -36.0, longitude: 22.0 }

variables:
  # ------------------------------------------------------------------
  # Physical ocean
  # ------------------------------------------------------------------
  sea_surface_temperature:
    code: sea_surface_temperature
    # The covariates the SHAP output is expected to surface. Air temperature
    # and wind speed genuinely drive surface heat exchange and mixing; they
    # are not decoration.
    covariates: [air_temperature, wind_speed, sea_surface_salinity]
    valid_min: -2.0
    valid_max: 40.0

  bottom_temperature:
    code: bottom_temperature
    covariates: [sea_surface_temperature, ocean_depth]
    valid_min: -2.5
    valid_max: 40.0

  water_temperature:
    code: water_temperature
    covariates: [sea_surface_temperature, ocean_depth]
    valid_min: -2.5
    valid_max: 40.0

  # Configured but deliberately left untrained — measured 2026-08-05, not an
  # oversight. Point salinity barely moves day to day (R2 0.9963 at h1), which
  # makes persistence near-unbeatable: h3 scored -0.152 and h7 -0.118 against
  # it, and the two horizons that did pass were inside fold noise (h1 +0.085
  # with 1/5 folds negative, h30 +0.106 with folds spanning -0.21 to +0.36).
  # All four artifacts were trained, inspected and deleted. Retraining it will
  # reproduce these numbers, not better ones — the covariates are not the
  # problem, the target's own persistence is. Ship it only if the fold spread
  # closes, not merely if the overall mean turns positive.
  sea_surface_salinity:
    code: sea_surface_salinity
    covariates: [sea_surface_temperature, rainfall]
    valid_min: 0.0
    valid_max: 45.0

  water_salinity:
    code: water_salinity
    covariates: [sea_surface_salinity, ocean_depth]
    valid_min: 0.0
    valid_max: 45.0

  current_u:
    code: current_u
    covariates: [wind_speed, sea_surface_height]

  current_v:
    code: current_v
    covariates: [wind_speed, sea_surface_height]

  current_speed:
    code: current_speed
    covariates: [wind_speed, sea_surface_height]
    valid_min: 0.0

  current_direction:
    code: current_direction
    covariates: [wind_speed, current_speed]
    circular: true
    valid_min: 0.0
    valid_max: 360.0

  significant_wave_height:
    code: significant_wave_height
    covariates: [wind_speed, wind_gust, mean_wave_period]
    valid_min: 0.0
    valid_max: 30.0

  maximum_wave_height:
    code: maximum_wave_height
    covariates: [significant_wave_height, wind_speed]
    valid_min: 0.0
    valid_max: 50.0

  mean_wave_period:
    code: mean_wave_period
    covariates: [significant_wave_height, wind_speed]
    valid_min: 0.0
    valid_max: 30.0

  peak_wave_period:
    code: peak_wave_period
    covariates: [significant_wave_height, mean_wave_period]
    valid_min: 0.0
    valid_max: 30.0

  wave_direction:
    code: wave_direction
    covariates: [wind_direction, significant_wave_height]
    circular: true
    valid_min: 0.0
    valid_max: 360.0

  sea_surface_height:
    code: sea_surface_height
    covariates: [pressure, wind_speed]

  sea_level_anomaly:
    code: sea_level_anomaly
    covariates: [sea_surface_height, pressure]
    # Altimetry coverage starts mid-2024, so the default 2-year window would
    # ask for data that does not exist. The history adapter clamps to the
    # provider's coverage anyway; this just makes the intent explicit.
    training:
      history_days: 365
      min_rows_per_point: 90
      min_total_rows: 300

  # ------------------------------------------------------------------
  # Atmospheric
  # ------------------------------------------------------------------
  wind_speed:
    code: wind_speed
    covariates: [pressure, air_temperature]
    valid_min: 0.0

  wind_direction:
    code: wind_direction
    covariates: [wind_speed, pressure]
    circular: true
    valid_min: 0.0
    valid_max: 360.0

  wind_gust:
    code: wind_gust
    covariates: [wind_speed, pressure]
    valid_min: 0.0

  air_temperature:
    code: air_temperature
    covariates: [sea_surface_temperature, humidity, pressure]

  humidity:
    code: humidity
    covariates: [air_temperature, pressure, rainfall]
    valid_min: 0.0
    valid_max: 100.0

  pressure:
    code: pressure
    covariates: [air_temperature, wind_speed]

  rainfall:
    code: rainfall
    covariates: [humidity, pressure, air_temperature]
    valid_min: 0.0
    # Precipitation is zero-inflated and heavy-tailed: most days are 0 and a
    # few are 200mm. log1p keeps the tail from dominating the split gain.
    log_transform: true

  # ------------------------------------------------------------------
  # Biogeochemistry
  # ------------------------------------------------------------------
  chlorophyll_a:
    code: chlorophyll_a
    covariates: [sea_surface_temperature, nitrate, primary_productivity]
    # Spans roughly three orders of magnitude between gyre and upwelling.
    log_transform: true
    valid_min: 0.0

  dissolved_oxygen:
    code: dissolved_oxygen
    covariates: [sea_surface_temperature, sea_surface_salinity, primary_productivity]
    valid_min: 0.0

  ph:
    code: ph
    covariates: [sea_surface_temperature, dissolved_oxygen]
    valid_min: 6.0
    valid_max: 9.0

  nitrate:
    code: nitrate
    covariates: [chlorophyll_a, sea_surface_temperature, phosphate]
    valid_min: 0.0
    log_transform: true

  phosphate:
    code: phosphate
    covariates: [nitrate, chlorophyll_a]
    valid_min: 0.0
    log_transform: true

  silicate:
    code: silicate
    covariates: [nitrate, chlorophyll_a]
    valid_min: 0.0
    log_transform: true

  primary_productivity:
    code: primary_productivity
    covariates: [chlorophyll_a, sea_surface_temperature, nitrate]
    valid_min: 0.0
    log_transform: true

  # ------------------------------------------------------------------
  # Ocean colour (not in the original variable list, but free: the registry
  # serves them and they cost one block each).
  # ------------------------------------------------------------------
  diffuse_attenuation:
    code: diffuse_attenuation
    covariates: [chlorophyll_a]
    valid_min: 0.0
    log_transform: true

  water_clarity:
    code: water_clarity
    covariates: [chlorophyll_a, diffuse_attenuation]
    valid_min: 0.0

  # ------------------------------------------------------------------
  # Ammonium and tidal height are intentionally absent, not forgotten: the
  # download registry has them as `available: false` (no global source), and
  # the loader rejects a variable whose provider does not exist. They become
  # forecastable the moment a provider is added, with a block like the above
  # and no engine change.
  # ------------------------------------------------------------------
