server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Over a real internet connection the bundle would otherwise be sent
    # uncompressed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
        image/svg+xml font/woff2 text/event-stream;

    # All backend routes live under /api (see backend/routers/*.py).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the backend keys rate limits on this
        # header, and appending would let a client pick its own key.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # routers/chat.py streams with text/event-stream; buffering would hold
        # the whole reply until the stream closes.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Vite emits content-hashed filenames under /assets, so they never change
    # in place and can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point must always be revalidated, or a redeploy would keep
    # serving the previous bundle's index.html.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: unmatched paths fall back to index.html rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
