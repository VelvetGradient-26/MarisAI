[pytest]
# Without this, `pytest tests/` fails at collection with
# `ModuleNotFoundError: No module named 'marine_ml'` and the suite silently
# does not run for anyone invoking pytest the obvious way.
#
# That matters more here than a broken path usually would, because of *what*
# these tests are: they enforce "only one forward shift exists", "never random
# K-fold", and "climatology fitted on training rows only". They are the
# guardrails against silent methodology error, so a suite that appears broken
# and gets skipped is the failure mode to avoid.
pythonpath = .
testpaths = tests
